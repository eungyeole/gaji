name: Nightly release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.1.${{ github.run_number }}
  RELEASE_VERSION: 0.1.${{ github.run_number }}
  FEED_TAG: nightly
  SPARKLE_VERSION: 2.9.4

jobs:
  macos:
    runs-on: macos-26-intel
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package universal macOS DMG
        env:
          GAJI_MACOS_UNIVERSAL: 1
          GAJI_VERSION: ${{ env.RELEASE_VERSION }}
          GAJI_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-macos.sh
      - name: Generate signed Sparkle appcast
        if: env.SPARKLE_PUBLIC_ED_KEY != '' && env.SPARKLE_PRIVATE_ED_KEY != ''
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle.tar.xz"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$RUNNER_TEMP/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            dist/macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/macos/Gaji-macOS.dmg
            dist/macos/appcast.xml
          if-no-files-found: warn

  windows:
    if: ${{ false }} # Temporarily paused while the Windows client is in preview.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*.zip
          if-no-files-found: error

  publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish versioned prerelease and refresh update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Gaji ${RELEASE_VERSION}" --prerelease --latest=false \
              --notes "Automated build ${GITHUB_SHA}."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Gaji ${RELEASE_VERSION}" --prerelease --latest=false \
              --notes "Automated build ${GITHUB_SHA}."
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber

          if gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$FEED_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Gaji Nightly Feed" --prerelease --latest=false \
              --notes "Latest automatic update feed: ${RELEASE_TAG}."
          else
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Gaji Nightly Feed" --prerelease --latest=false \
              --notes "Latest automatic update feed: ${RELEASE_TAG}."
          fi
          gh release upload "$FEED_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
